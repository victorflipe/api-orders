name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        # Credenciais fixas de propósito: o banco existe só dentro do job, sem
        # acesso externo, e PRs de forks não recebem secrets do repositório.
        env:
          POSTGRES_DB: orders_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Os testes criam o banco orders_db_test sob demanda neste mesmo servidor
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orders_db

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Rodar testes
        run: uv run pytest
